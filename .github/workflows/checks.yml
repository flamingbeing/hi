# Repo checks on every PR (AGENTS.md, "Checks before merging"). Apps' browser tests run in their own workflows.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: flamingbeing/app-devkit/setup-node@v1
      - run: node tools/check.mjs
      - run: node tools/stamp-versions.mjs --check
      - name: Unit tests
        run: |
          shopt -s nullglob
          for f in */test/*.test.mjs; do echo "== $f"; node "$f"; done

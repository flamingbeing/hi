# Repo checks on every PR (AGENTS.md, "Checks before merging"). Apps' browser tests run in their own workflows.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs
      - run: node tools/stamp-versions.mjs --check
      - name: Unit tests
        run: |
          shopt -s nullglob
          for f in */test/*.test.mjs; do echo "== $f"; node "$f"; done

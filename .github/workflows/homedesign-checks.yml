# Home design system checks (homedesign/README.md, "Tests"): contrast pairs and the browser test, on PRs touching it.
name: Home design checks
on:
  pull_request:
    paths:
      - 'homedesign/**'
      - '.github/workflows/homedesign-checks.yml'
  workflow_dispatch:
concurrency:
  group: homedesign-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  homedesign:
    runs-on: ubuntu-24.04   # Playwright 1.56.1 has no browser deps for ubuntu-latest (26.04)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1
      - run: node homedesign/test/contrast.test.mjs
      - name: Install Playwright and axe-core
        run: npm install --no-save playwright@1.56.1 axe-core
      - uses: flamingbeing/app-devkit/setup-browser@v1
        with:
          playwright-version: '1.56.1'
          devkit-dir: ''
      - name: Browser test
        env:
          PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright/index.mjs
          SHOTS: ${{ runner.temp }}/homedesign-shots
        run: node homedesign/test/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homedesign-screenshots
          path: ${{ runner.temp }}/homedesign-shots
          if-no-files-found: ignore

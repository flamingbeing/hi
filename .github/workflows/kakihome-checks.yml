# Kaki Home checks (kakihome/NOTES.md, "How to test"): unit tests, the phone browser test (Playwright + axe) and family
# sharing against the local Firebase emulators (demo-kakihome project, fake accounts), on PRs touching Kaki Home, the
# design kit it uses or Firebase's sign-in pages.
name: Kaki Home checks
on:
  pull_request:
    paths:
      - 'kakihome/**'
      - 'homedesign/**'
      - '__/**'
      - '.github/workflows/kakihome-checks.yml'
  workflow_dispatch:
jobs:
  pantry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: node kakihome/test/logic.test.mjs
      - run: node kakihome/test/config.test.mjs
      - run: node kakihome/test/quick.test.mjs
      - run: node kakihome/test/tour.test.mjs
      - run: node kakihome/test/photo.test.mjs
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save playwright@1.56.1 axe-core
          npx playwright install --with-deps chromium
      - name: Browser test
        env:
          PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright/index.mjs
          SHOTS: ${{ runner.temp }}/kakihome-shots
        run: node kakihome/test/e2e.mjs
      - name: Family sharing (local emulators)
        env:
          PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: kakihome/test/run-sync.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kakihome-screenshots
          path: ${{ runner.temp }}/kakihome-shots
          if-no-files-found: ignore

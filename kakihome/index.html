<!doctype html>
<html lang="en-SG" class="ha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="Kaki Home: know what you have, buy what you need, use what you own before it expires.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaki Home">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Kaki Home</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="/homedesign/tokens.css">
<link rel="stylesheet" href="/homedesign/app.css">
<link rel="stylesheet" href="kakihome.css">
<link rel="modulepreload" href="/homedesign/app.js">
</head>
<body class="ha-body ha-has-tabbar">
<a class="ha-skip" href="#main">Skip to content</a>

<header class="ha-bar">
  <div class="ha-bar-row">
    <div class="ha-bar-lead" id="bar-lead"></div>
    <div class="ha-bar-title" id="bar-title" aria-hidden="true">Kaki Home</div>
    <div class="ha-bar-trail" id="bar-trail"></div>
  </div>
</header>

<main class="ha-main" id="main" tabindex="-1">
  <h1 class="ha-large-title">Kaki Home</h1>
  <ul class="ha-list" aria-busy="true" aria-label="Loading">
    <li><div class="ha-row"><span class="ha-skeleton ha-skeleton--thumb"></span><span class="ha-row-body"><span class="ha-skeleton ha-skeleton--line"></span><span class="ha-skeleton ha-skeleton--short"></span></span></div></li>
    <li><div class="ha-row"><span class="ha-skeleton ha-skeleton--thumb"></span><span class="ha-row-body"><span class="ha-skeleton ha-skeleton--line"></span><span class="ha-skeleton ha-skeleton--short"></span></span></div></li>
  </ul>
</main>

<nav class="ha-tabbar" aria-label="Tabs">
  <div class="ha-tabbar-inner">
    <a class="ha-tab" href="#/"><span class="ha-tab-icon"><svg class="ha-icon" aria-hidden="true"><use href="/homedesign/icons.svg#i-home"/></svg></span><span class="ha-tab-label">Kaki Home</span></a>
    <a class="ha-tab" href="#/items"><span class="ha-tab-icon"><svg class="ha-icon" aria-hidden="true"><use href="/homedesign/icons.svg#i-list"/></svg></span><span class="ha-tab-label">Items</span></a>
    <button type="button" class="ha-tab ha-tab--action" data-act="go-add"><span class="ha-tab-icon"><svg class="ha-icon" aria-hidden="true"><use href="/homedesign/icons.svg#i-plus"/></svg></span><span class="ha-tab-label">Add an item</span></button>
    <a class="ha-tab" href="#/shop"><span class="ha-tab-icon"><svg class="ha-icon" aria-hidden="true"><use href="/homedesign/icons.svg#i-cart"/></svg><span class="ha-tab-badge" id="kh-shop-badge" aria-hidden="true" hidden></span></span><span class="ha-tab-label">Shopping</span><span class="ha-sr" id="kh-shop-sr"></span></a>
    <a class="ha-tab" href="#/settings"><span class="ha-tab-icon"><svg class="ha-icon" aria-hidden="true"><use href="/homedesign/icons.svg#i-settings"/></svg></span><span class="ha-tab-label">Settings</span></a>
  </div>
</nav>

<div class="ha-toolbar" id="kh-toolbar" hidden>
  <div class="ha-toolbar-inner"><button type="submit" form="kh-form" class="ha-btn ha-btn--primary" id="kh-save">Add item</button></div>
</div>

<noscript><p class="ha-panel">Kaki Home needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="serif">
  <defs>
    <radialGradient id="parch" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#FBF6EC"/>
      <stop offset="0.7" stop-color="#F6EFE2"/>
      <stop offset="1" stop-color="#E9DABF"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D3B5"/>
      <stop offset="1" stop-color="#E3B993"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="1" stop-color="#E6D9C2"/>
    </linearGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F4ECE1"/>
      <stop offset="1" stop-color="#C9CED6"/>
    </linearGradient>
    <linearGradient id="muscle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2544F"/>
      <stop offset="1" stop-color="#9E2B30"/>
    </linearGradient>
    <linearGradient id="fds" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E58A7E"/>
      <stop offset="1" stop-color="#C0605A"/>
    </linearGradient>
    <linearGradient id="pulley" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C676"/>
      <stop offset="1" stop-color="#B98A2E"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E6F7A"/>
      <stop offset="1" stop-color="#6E4E5C"/>
    </linearGradient>
    <pattern id="striae" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7E1F26" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- parchment and border -->
  <rect width="1000" height="560" fill="#5B1A2B"/>
  <rect x="8" y="8" width="984" height="544" rx="10" fill="url(#parch)"/>
  <rect x="16" y="16" width="968" height="528" rx="6" fill="none" stroke="#D4A84B" stroke-width="3"/>
  <rect x="22" y="22" width="956" height="516" rx="4" fill="none" stroke="#D4A84B" stroke-width="1"/>
  <g fill="#D4A84B">
    <path d="M16 46 Q30 30 46 16 L56 16 Q36 34 26 56 L16 56Z"/>
    <path d="M984 46 Q970 30 954 16 L944 16 Q964 34 974 56 L984 56Z"/>
    <path d="M16 514 Q30 530 46 544 L56 544 Q36 526 26 504 L16 504Z"/>
    <path d="M984 514 Q970 530 954 544 L944 544 Q964 526 974 504 L984 504Z"/>
  </g>

  <!-- Zone II highlight -->
  <rect x="512" y="150" width="248" height="290" fill="#C2272D" opacity="0.07"/>
  <g stroke="#5B1A2B" stroke-width="1" stroke-dasharray="4 4" opacity="0.45">
    <line x1="225" y1="160" x2="225" y2="440"/>
    <line x1="296" y1="160" x2="296" y2="440"/>
    <line x1="512" y1="150" x2="512" y2="440"/>
    <line x1="760" y1="150" x2="760" y2="440"/>
  </g>

  <!-- the land: skin silhouette of forearm, palm and finger (lateral view, volar side down) -->
  <path d="M128 182 L230 186 C300 189 420 186 500 191 C528 192 546 196 562 201 L690 201 C701 200 709 202 716 204 L800 207 C816 207 828 209 842 212 C880 214 906 224 914 242 C919 262 906 282 882 290 C852 297 832 296 816 293 C806 296 790 296 760 297 C736 298 720 298 704 297 C694 300 680 301 640 303 C600 305 575 307 560 309 C545 310 532 314 520 318 C500 330 470 337 400 340 C340 341 300 336 262 328 C230 330 180 332 128 334 Z" fill="url(#skin)" stroke="#A9714C" stroke-width="1.6"/>
  <!-- creases -->

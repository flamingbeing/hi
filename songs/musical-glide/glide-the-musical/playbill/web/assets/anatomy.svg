    <!-- middle phalanx -->
    <path d="M708 219 C718 216 726 218 734 222 L792 223 C802 219 812 224 814 232 C815 241 808 248 798 248 L734 248 C726 252 718 254 708 251 C713 241 713 229 708 219 Z"/>
    <!-- distal phalanx -->
    <path d="M822 222 C832 219 840 222 846 226 L874 229 C884 226 892 230 892 236 C892 242 884 246 874 243 L846 245 C840 249 832 251 822 248 C826 240 826 230 822 222 Z"/>
  </g>
  <!-- joint markers -->
  <g fill="#D4A84B" stroke="#5B1A2B" stroke-width="1">
    <circle cx="540" cy="235" r="3.5"/>
    <circle cx="703" cy="235" r="3"/>
    <circle cx="818" cy="235" r="3"/>
  </g>

  <!-- extensor (dorsal) -->
  <path d="M150 204 C230 200 320 205 420 207 C480 208 520 206 548 210 C600 212 660 212 704 214 C740 214 780 215 812 218 C820 219 826 221 830 223" fill="none" stroke="#C9CED6" stroke-width="6" stroke-linecap="round"/>
  <path d="M150 203 C230 199 320 204 420 206 C480 207 520 205 548 209 C600 211 660 211 704 213 C740 213 780 214 812 217" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8"/>

  <!-- flexor sheath (synovial) -->
  <path d="M506 256 C540 252 560 254 600 254 L700 252 L760 250 L826 250 L832 262 C810 284 780 286 760 286 L700 288 L600 292 C560 294 535 298 506 300 Z" fill="#DCE3EC" opacity="0.6" stroke="#9AA6B2" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- FDS muscle belly (forearm) -->
  <path d="M120 300 C150 292 190 294 222 299 C200 306 160 314 120 312 Z" fill="url(#fds)" stroke="#8E3B3B" stroke-width="1"/>
  <!-- King Profundus: FDP muscle belly -->
  <path d="M118 264 C150 258 190 264 222 280 C200 290 160 294 118 290 Z" fill="url(#muscle)" stroke="#7E1F26" stroke-width="1.2"/>
  <path d="M118 264 C150 258 190 264 222 280 C200 290 160 294 118 290 Z" fill="url(#striae)"/>

  <!-- FDS tendon: single cord to the split -->
  <path d="M215 300 C300 300 420 300 500 294 C540 291 570 288 598 284" fill="none" stroke="#7D8794" stroke-width="10.4" stroke-linecap="round"/>
  <path d="M215 300 C300 300 420 300 500 294 C540 291 570 288 598 284" fill="none" stroke="url(#pearl)" stroke-width="8" stroke-linecap="round"/>
  <path d="M215 300 C300 300 420 300 500 294 C540 291 570 288 598 284" fill="none" stroke="#8C96A3" stroke-width="0.8" opacity="0.6" transform="translate(0 3.5)"/>
  <!-- FDS far slip (behind FDP) -->
  <path d="M598 284 C630 282 648 268 676 260 C700 254 720 252 740 250" fill="none" stroke="#8C96A3" stroke-width="3" stroke-dasharray="4 3" opacity="0.8"/>

  <!-- FDP tendon -->
  <path d="M215 284 C300 283 420 282 500 278 C560 275 620 273 700 272 C750 271 790 268 812 262 C822 258 828 254 834 248" fill="none" stroke="#7D8794" stroke-width="11.4" stroke-linecap="round"/>
  <path d="M215 284 C300 283 420 282 500 278 C560 275 620 273 700 272 C750 271 790 268 812 262 C822 258 828 254 834 248" fill="none" stroke="url(#pearl)" stroke-width="9" stroke-linecap="round"/>
  <path d="M215 281 C300 280 420 279 500 275 C560 272 620 270 700 269 C750 268 790 265 812 259" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.9"/>
  <path d="M215 288 C300 287 420 286 500 282 C560 279 620 277 700 276 C750 275 790 272 810 266" fill="none" stroke="#9AA3AF" stroke-width="0.8" opacity="0.7"/>

  <!-- FDS near slip wraps around FDP to Camper's chiasm, then inserts on middle phalanx -->
  <path d="M598 284 C622 286 640 282 652 272 C662 263 668 260 680 258 C700 255 718 252 742 250" fill="none" stroke="#7D8794" stroke-width="7.4" stroke-linecap="round"/>
  <path d="M598 284 C622 286 640 282 652 272 C662 263 668 260 680 258 C700 255 718 252 742 250" fill="none" stroke="url(#pearl)" stroke-width="5" stroke-linecap="round"/>
  <path d="M598 284 C622 286 640 282 652 272 C662 263 668 260 680 258 C700 255 718 252 742 250" fill="none" stroke="#8C96A3" stroke-width="0.7" opacity="0.7"/>
  <!-- FDS insertion footprint -->
  <path d="M722 249 L762 249" stroke="#B98A2E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- FDP insertion footprint -->
  <path d="M828 247 L842 245" stroke="#B98A2E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- carpal tunnel: transverse carpal ligament -->
  <path d="M226 308 C250 312 272 312 296 308 L296 316 C272 320 250 320 226 316 Z" fill="#5B1A2B" opacity="0.85"/>

  <!-- annular pulleys -->
  <g fill="url(#pulley)" fill-opacity="0.62" stroke="#5B1A2B" stroke-width="1.2">
    <rect x="514" y="258" width="32" height="30" rx="6"/>
    <rect x="560" y="253" width="76" height="35" rx="7"/>
    <rect x="696" y="252" width="16" height="31" rx="5"/>
    <rect x="738" y="250" width="40" height="30" rx="6"/>
    <rect x="811" y="250" width="12" height="20" rx="4"/>
  </g>
  <!-- cruciate pulleys (faint) -->
  <g stroke="#B98A2E" stroke-width="1.1" opacity="0.4">
    <path d="M642 258 L690 286 M642 286 L690 258"/>
    <path d="M784 254 L806 278 M784 278 L806 254"/>
  </g>
  <!-- tendons glimpsed through pulleys -->

  <!-- lumbrical (Lumbo), arising from radial side of FDP, passing volar to MCP to the lateral band -->
  <path d="M372 283 C400 278 450 282 486 292 C470 302 420 302 372 287 Z" fill="url(#muscle)" stroke="#7E1F26" stroke-width="1" opacity="0.95"/>
  <path d="M372 283 C400 278 450 282 486 292 C470 302 420 302 372 287 Z" fill="url(#striae)"/>
  <path d="M484 293 C512 300 536 302 556 294 C580 282 596 252 620 228 C634 216 648 213 662 213" fill="none" stroke="#D9706A" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 3" opacity="0.75"/>

  <!-- here be Scarlett: tangled crimson scar motif in zone II -->
  <g fill="none" stroke="#C2272D" stroke-width="1.4" stroke-dasharray="3 2" opacity="0.9">
    <path d="M716 262 c5 -9 14 3 9 11 c-5 7 -15 -2 -8 -9 c9 -7 18 5 11 14 c-5 5 -12 0 -7 -5"/>
    <path d="M718 282 c7 -5 14 5 5 9 c-9 4 -10 -9 0 -9"/>
    <path d="M713 274 c4 5 13 7 22 1"/>
  </g>

  <!-- castle of King Profundus -->
  <g>
    <path d="M40 316 L40 196 L52 196 L52 186 L62 186 L62 196 L72 196 L72 186 L82 186 L82 196 L92 196 L92 186 L102 186 L102 196 L112 196 L112 316 Z" fill="url(#stone)" stroke="#2E1A33" stroke-width="1.4"/>
    <path d="M58 150 L58 196 L96 196 L96 150 Z" fill="#7C5A68" stroke="#2E1A33" stroke-width="1.4"/>
    <path d="M52 150 L77 112 L102 150 Z" fill="#5B1A2B" stroke="#2E1A33" stroke-width="1.4"/>
    <line x1="77" y1="112" x2="77" y2="94" stroke="#2E1A33" stroke-width="1.5"/>
    <path d="M77 94 L96 100 L77 106 Z" fill="#C2272D"/>
    <rect x="70" y="160" width="14" height="20" rx="7" fill="#2E1A33"/>
    <path d="M30 316 L30 232 L36 232 L36 226 L42 226 L42 232 L48 232 L48 316 Z" fill="#7C5A68" stroke="#2E1A33" stroke-width="1.2"/>
    <path d="M28 232 L39 210 L50 232 Z" fill="#D4A84B" stroke="#2E1A33" stroke-width="1"/>
    <!-- gate where the King's muscle emerges -->
    <path d="M96 316 L96 270 Q112 252 128 270 L128 316 Z" fill="#2E1A33"/>
    <g stroke="#D4A84B" stroke-width="1" opacity="0.5">
      <line x1="40" y1="230" x2="112" y2="230"/><line x1="40" y1="262" x2="96" y2="262"/><line x1="40" y1="294" x2="96" y2="294"/>
    </g>
    <circle cx="77" cy="226" r="6" fill="#D4A84B" stroke="#5B1A2B"/>
    <path d="M73 225 l2 -4 2 3 2 -3 2 4 z" fill="#5B1A2B"/>
  </g>

  <!-- title cartouche -->
  <g>
    <path d="M140 34 L470 34 Q482 34 482 46 L482 92 Q482 104 470 104 L140 104 Q128 104 128 92 L128 46 Q128 34 140 34 Z" fill="#F6EFE2" stroke="#D4A84B" stroke-width="2"/>
    <text x="305" y="64" text-anchor="middle" font-size="25" font-weight="bold" fill="#5B1A2B" letter-spacing="1">Map of the Kingdom</text>
    <text x="305" y="84" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2E1A33">Mae's left ring finger, seen from the side (palm down)</text>
    <text x="305" y="98" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6E4E5C">after old Doctor Bunnell's flexor zones</text>
  </g>

  <!-- compass rose -->
  <g transform="translate(905 74) scale(0.82)">
    <circle r="30" fill="none" stroke="#D4A84B" stroke-width="1.5"/>
    <circle r="22" fill="none" stroke="#D4A84B" stroke-width="0.8"/>
    <path d="M0 -36 L6 -6 L0 0 L-6 -6 Z M0 36 L6 6 L0 0 L-6 6 Z" fill="#5B1A2B"/>
    <path d="M-36 0 L-6 -6 L0 0 L-6 6 Z M36 0 L6 -6 L0 0 L6 6 Z" fill="#D4A84B" stroke="#5B1A2B" stroke-width="0.8"/>
    <circle r="3" fill="#F6EFE2" stroke="#5B1A2B"/>
    <g font-size="10.5" fill="#2E1A33" text-anchor="middle" font-weight="bold">
      <text y="-42">Dorsal</text>
      <text y="51">Volar</text>
      <text x="-60" y="4">Proximal</text>
      <text x="56" y="4">Distal</text>
    </g>
  </g>

  <!-- ===== labels ===== -->
  <g font-size="13" fill="#2E1A33" stroke="none">
    <!-- leaders -->
    <g stroke="#5B1A2B" stroke-width="0.9" fill="none">
      <path d="M410 158 L410 228"/>
      <path d="M612 140 L612 230"/>
      <path d="M760 140 L760 232"/>
      <path d="M862 158 L862 234"/>
      <path d="M540 178 L540 228"/>
      <path d="M703 178 L703 229"/>
      <path d="M818 178 L818 229"/>
      <path d="M360 178 L360 206"/>
      <!-- below -->
      <path d="M120 342 L150 287"/>
      <path d="M172 400 L176 311"/>
      <path d="M262 370 L262 318"/>
      <path d="M340 386 L340 302"/>
      <path d="M430 368 L430 292"/>
      <path d="M580 380 L600 288"/>
      <path d="M660 400 L670 262"/>
      <path d="M790 364 L752 251"/>
      <path d="M868 334 L838 250"/>
      <path d="M512 192 L520 260"/>
    </g>

    <text x="410" y="152" text-anchor="middle" font-weight="bold">Metacarpal</text>
    <text x="612" y="134" text-anchor="middle" font-weight="bold">Proximal phalanx</text>
    <text x="760" y="134" text-anchor="middle" font-weight="bold">Middle phalanx</text>
    <text x="862" y="152" text-anchor="middle" font-weight="bold">Distal phalanx</text>
    <text x="540" y="174" text-anchor="middle" font-size="12" fill="#5B1A2B">MCP joint</text>
    <text x="703" y="174" text-anchor="middle" font-size="12" fill="#5B1A2B">PIP joint</text>
    <text x="818" y="174" text-anchor="middle" font-size="12" fill="#5B1A2B">DIP joint</text>
    <text x="360" y="174" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5A6470">Extensor tendon</text>
    <text x="440" y="186" text-anchor="start" font-size="11.5" font-style="italic" fill="#5A6470">Flexor sheath</text>

    <!-- pulley tags -->
    <g font-size="12" font-weight="bold" fill="#5B1A2B" text-anchor="middle">
      <text x="530" y="306">A1</text>
      <text x="598" y="302">A2</text>
      <text x="704" y="296">A3</text>
      <text x="758" y="294">A4</text>
      <text x="817" y="285">A5</text>
    </g>

    <text x="96" y="356" text-anchor="middle" font-weight="bold" fill="#7E1F26">King Profundus</text>
    <text x="96" y="370" text-anchor="middle" font-size="11" font-style="italic">FDP muscle, in his castle</text>
    <text x="172" y="414" text-anchor="middle" font-size="11.5">FDS muscle</text>
    <text x="262" y="384" text-anchor="middle" font-size="12">Carpal tunnel</text>
    <text x="340" y="400" text-anchor="middle" font-size="12">FDS tendon</text>
    <text x="430" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#7E1F26">Lumbrical</text>
    <text x="430" y="396" text-anchor="middle" font-size="11" font-style="italic">from radial side of FDP</text>
    <text x="575" y="394" text-anchor="middle" font-size="12">FDS splits</text>
    <text x="660" y="414" text-anchor="middle" font-size="12" font-weight="bold">Camper's chiasm</text>
    <text x="800" y="378" text-anchor="middle" font-size="12">FDS inserts on</text>
    <text x="800" y="392" text-anchor="middle" font-size="12">middle phalanx</text>
    <text x="880" y="348" text-anchor="middle" font-size="12">FDP inserts on</text>
    <text x="880" y="362" text-anchor="middle" font-size="12">distal phalanx</text>
    <path d="M716 326 Q722 308 724 292" fill="none" stroke="#C2272D" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="666" y="340" text-anchor="start" font-size="12" font-style="italic" fill="#C2272D">here be Scarlett</text>
    <text x="342" y="276" text-anchor="middle" font-size="11.5" font-weight="bold">FDP</text>
  </g>

  <!-- zone ruler -->
  <g>
    <line x1="40" y1="452" x2="915" y2="452" stroke="#5B1A2B" stroke-width="1.5"/>
    <g stroke="#5B1A2B" stroke-width="1.5">
      <line x1="40" y1="444" x2="40" y2="460"/>
      <line x1="225" y1="444" x2="225" y2="460"/>
      <line x1="296" y1="444" x2="296" y2="460"/>
      <line x1="512" y1="444" x2="512" y2="460"/>
      <line x1="760" y1="444" x2="760" y2="460"/>
      <line x1="915" y1="444" x2="915" y2="460"/>
    </g>
    <rect x="512" y="446" width="248" height="12" fill="#C2272D" opacity="0.85"/>
    <g font-size="15" font-weight="bold" fill="#5B1A2B" text-anchor="middle">
      <text x="132" y="478">Zone V</text>
      <text x="260" y="478">Zone IV</text>
      <text x="404" y="478">Zone III</text>
      <text x="838" y="478">Zone I</text>
    </g>
    <text x="636" y="480" text-anchor="middle" font-size="17" font-weight="bold" fill="#C2272D">Zone II - No Man's Land</text>
    <g font-size="10.5" font-style="italic" fill="#4A3A4E" text-anchor="middle">
      <text x="132" y="494">forearm</text>
      <text x="260" y="494">carpal tunnel</text>
      <text x="404" y="494">palm, lumbrical origin</text>
      <text x="636" y="497">A1 pulley (distal palmar crease) to FDS insertion</text>
      <text x="838" y="494">distal to FDS insertion</text>
    </g>
  </g>
  <text x="500" y="526" text-anchor="middle" font-size="11" font-style="italic" fill="#6E4E5C">Pulleys A1, A3, A5 sit over the joints; A2 and A4 hold to the bone. FDS splits to let FDP pass through, then rejoins beneath it.</text>
</svg>

    <path d="M520 318 q-6 6 -14 9"/>
    <path d="M704 297 q-2 5 -6 7"/>
    <path d="M816 293 q-2 4 -6 6"/>
    <path d="M262 328 q-4 5 -10 7"/>
  </g>
  <!-- nail -->
  <path d="M842 212 C868 212 892 216 904 226 L898 230 C886 222 866 219 842 219 Z" fill="#F8E4D6" stroke="#A9714C" stroke-width="1"/>

  <!-- bones -->

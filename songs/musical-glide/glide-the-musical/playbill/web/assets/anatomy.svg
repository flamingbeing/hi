    <!-- radius -->
    <path d="M128 214 L200 214 C214 212 226 206 234 210 L236 262 C226 266 214 258 200 256 L128 256 Z"/>
    <!-- carpals -->
    <ellipse cx="252" cy="222" rx="14" ry="12"/>
    <ellipse cx="252" cy="248" rx="14" ry="13"/>
    <ellipse cx="280" cy="226" rx="13" ry="13"/>
    <ellipse cx="280" cy="250" rx="13" ry="12"/>
    <!-- metacarpal -->
    <path d="M300 216 C308 214 316 218 330 221 L490 222 C505 214 520 213 532 220 C544 228 544 244 532 251 C520 258 505 256 490 248 L330 249 C316 252 308 256 300 254 Z"/>
    <!-- proximal phalanx -->

<linearGradient id="skinB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3CDA8"/><stop offset="1" stop-color="#DDA87E"/></linearGradient>
<linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4FBFA"/><stop offset="1" stop-color="#BFE0DB"/></linearGradient>

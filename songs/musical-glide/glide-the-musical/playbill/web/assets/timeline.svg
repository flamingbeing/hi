 <g fill="#E3A985" opacity=".7"><ellipse cx="-14.8" cy="-20" rx="3" ry="1.6"/><ellipse cx="-4.2" cy="-23" rx="3" ry="1.6"/><ellipse cx="6.2" cy="-22" rx="3" ry="1.6"/><ellipse cx="16.2" cy="-18" rx="2.6" ry="1.4"/></g>
 <!-- adult thumb across the front -->

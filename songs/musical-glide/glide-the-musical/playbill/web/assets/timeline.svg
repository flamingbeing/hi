<!-- 2 Day 2: wide-awake repair -->
<g transform="translate(192 140)" clip-path="url(#clip)"><g transform="translate(0 0)">
 <g transform="rotate(-42)">
  <circle cx="-26" cy="-7" r="6.5" fill="none" stroke="url(#silver)" stroke-width="3"/>

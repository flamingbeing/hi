 <path d="M-38 -4 L-8 -6 Q6 -6 16 2 L36 16 Q40 20 36 25 L31 22 L13 10 Q4 4 -8 4 L-38 6 Z" fill="url(#shell)" stroke="#2A9D8F" stroke-width="1.6" stroke-linejoin="round"/>
 <path d="M-34 -2 L-9 -3.5 Q4 -3.5 13 3" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
</g>
<g id="arm">

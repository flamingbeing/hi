 <path d="M-32 7.5 L-8 4 Q2 2.5 8 7 L20 18" fill="none" stroke="#F4ECE1" stroke-width="2" stroke-linecap="round"/>
 <path d="M-32 7.5 L-8 4 Q2 2.5 8 7 L20 18" fill="none" stroke="#C9CED6" stroke-width=".6" stroke-linecap="round"/>

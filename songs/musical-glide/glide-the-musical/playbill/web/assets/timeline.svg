 <!-- child's fingertips peeking out on the left -->
 <g fill="url(#skinB)" stroke="#C48A5E" stroke-width=".8"><rect x="-30" y="0.5" width="10" height="5" rx="2.5"/><rect x="-31" y="5.5" width="11" height="5" rx="2.5"/></g>
 <!-- gold glow -->
 <g fill="#D4A84B"><path d="M-30 -24 l1.4 -3.6 l1.4 3.6 l3.6 1.4 l-3.6 1.4 l-1.4 3.6 l-1.4 -3.6 l-3.6 -1.4z"/><path d="M28 -20 l1 -2.6 l1 2.6 l2.6 1 l-2.6 1 l-1 2.6 l-1 -2.6 l-2.6 -1z"/></g>
</g></g>


 <g transform="translate(22 -14)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#F2C94C" stroke="#D4A84B" stroke-width=".8"/><circle r="1.6" fill="#FFFFFF"/></g>
 <circle cx="10" cy="-20" r="1.6" fill="#F2C94C"/><circle cx="32" cy="-24" r="1.2" fill="#F2C94C"/>
</g></g>


 <path d="M-34 -2 L-6 -6 Q6 -8 13 -2 L24 10 Q28 15 24 19 Q20 22 16 18 L6 8 Q0 4 -8 6 L-34 10 Z" fill="none"/>
 <path d="M23 12 q2 2 1 4.5" fill="none" stroke="#E7B9A0" stroke-width="2.4" stroke-linecap="round"/>
 <path d="M-4 -1 q2 2 0 4 M10 2 q2 2 0 4" fill="none" stroke="#B87A50" stroke-width=".9" stroke-linecap="round"/>

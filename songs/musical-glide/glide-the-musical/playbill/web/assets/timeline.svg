</g></g>

<!-- 5 Weeks 3-6: Scarlett's reign -->
<g transform="translate(564 140)" clip-path="url(#clip)"><g transform="translate(0 2)">
 <g fill="none" stroke-linecap="round">
  <path d="M-28 6 C-20 -18 -2 22 6 -6 S24 -20 28 4 S6 26 -6 10 S-26 -6 -12 -14 S16 -6 14 12 S-14 26 -24 14" stroke="#C2272D" stroke-width="2.4"/>
  <path d="M-22 -6 C-8 -24 22 -16 18 2 S-6 20 -10 2 S8 -14 20 -6 S30 18 10 22" stroke="#8E1A22" stroke-width="1.6"/>

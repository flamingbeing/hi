 <text x="500" y="67" font-size="12" font-style="italic" fill="#2E1A33" opacity=".8">the long road from the cut to the fist</text>
</g>
<g stroke="#D4A84B" stroke-width="1.4" fill="none" stroke-linecap="round">
 <path d="M300 40 H382"/><path d="M618 40 H700"/>
 <path d="M382 40 q6 -6 12 0"/><path d="M606 40 q6 -6 12 0"/>
</g>
<circle cx="298" cy="40" r="2.5" fill="#D4A84B"/><circle cx="702" cy="40" r="2.5" fill="#D4A84B"/>

<!-- the path -->
<path id="road" d="M32 148 C46 156 54 140 68 140 C110 140 150 162 192 140 C234 118 274 162 316 140 C358 118 398 162 440 140 C482 118 522 162 564 140 C606 118 646 162 688 140 C730 118 770 162 812 140 C854 118 894 162 936 140 C952 132 962 138 968 138" fill="none" stroke="#2E1A33" stroke-width="15" stroke-linecap="round"/>
<path d="M32 148 C46 156 54 140 68 140 C110 140 150 162 192 140 C234 118 274 162 316 140 C358 118 398 162 440 140 C482 118 522 162 564 140 C606 118 646 162 688 140 C730 118 770 162 812 140 C854 118 894 162 936 140 C952 132 962 138 968 138" fill="none" stroke="#D4A84B" stroke-width="2.4" stroke-dasharray="7 6" stroke-linecap="round"/>

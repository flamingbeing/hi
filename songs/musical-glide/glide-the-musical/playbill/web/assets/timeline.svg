  <path d="M-20 -6 L4 -1.4 L26 -1" stroke="#9AA2AE" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M-20 6 L4 1.4 L26 1" stroke="#C9CED6" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <circle cx="4" cy="0" r="3.2" fill="#8E96A3" stroke="#F3F5F8" stroke-width=".8"/>
  <path d="M-14 -4.6 l3 9.2 M-11 -4 l3 8" stroke="#8E96A3" stroke-width="1"/>
 </g>
 <!-- curved needle held in the jaws -->
 <path d="M14 -24 a9 9 0 1 1 10 12" fill="none" stroke="#5E6672" stroke-width="2.4" stroke-linecap="round"/>
 <path d="M14 -24 a9 9 0 1 1 10 12" fill="none" stroke="#E6E9EE" stroke-width=".8" stroke-linecap="round"/>

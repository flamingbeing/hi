<radialGradient id="med" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#FFFDF8"/><stop offset="1" stop-color="#F1E5CF"/></radialGradient>
<radialGradient id="medS" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#FFF6F2"/><stop offset="1" stop-color="#F3D9D4"/></radialGradient>
